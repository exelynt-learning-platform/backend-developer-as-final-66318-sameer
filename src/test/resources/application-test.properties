# MySQL Test Database
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/booking_db_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:bullet7343}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

  # JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000

  # Seeder
app.seed.enabled=false