server.port=${SERVER_PORT:8080}

spring.application.name=resource-booking-system

# MySQL

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seeder
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.user-username=${SEED_USER_USERNAME:user}
app.seed.user-password=${SEED_USER_PASSWORD:User@123}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.sameer.booking=DEBUG
